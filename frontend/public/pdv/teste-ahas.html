<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste AHAS - Panificadora Carvalho</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f1eb;
      padding: 30px;
      text-align: center;
    }

    h1 {
      color: #3b2418;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 25px;
    }

    iframe {
      width: 100%;
      height: 120px;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Panificadora Carvalho</h1>

  <p>Teste de comunicação com AHAS Print Service</p>

  <div class="box">
    <h2>Teste direto</h2>

    <p>
      O quadro abaixo tenta acessar diretamente o AHAS:
    </p>

    <iframe
      src="http://localhost:8765/health"
      title="Teste AHAS">
    </iframe>

    <p>
      Se aparecer a resposta do AHAS dentro do quadro,
      significa que o Safari consegue acessar o serviço local.
    </p>
  </div>

</body>
</html>
